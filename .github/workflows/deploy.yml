name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: Pages cannot be enabled from this workflow. GitHub deliberately
      # blocks the Actions GITHUB_TOKEN from creating a Pages site
      # (actions/configure-pages#198, #40) — "Resource not accessible by
      # integration". The site must be switched on once, by a human:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # After that this workflow deploys on every push to main.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html
          # Fail the build early if the artefact is broken or empty.
          test -s dist/index.html
          grep -qi "<html" dist/index.html
          grep -qi "</html>" dist/index.html
          touch dist/.nojekyll
          echo "Built dist/ — $(wc -c < dist/index.html) bytes"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
