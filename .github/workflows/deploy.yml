name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: Pages cannot be enabled from this workflow. GitHub deliberately
      # blocks the Actions GITHUB_TOKEN from creating a Pages site
      # (actions/configure-pages#198, #40) — "Resource not accessible by
      # integration". The site must be switched on once, by a human:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # After that this workflow deploys on every push to main.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/deck dist/dashboard
          cp index.html dist/index.html
          cp deck/index.html dist/deck/index.html
          cp dashboard/index.html dist/dashboard/index.html
          # Fail the build early if any page is broken or empty.
          for page in dist/index.html dist/deck/index.html dist/dashboard/index.html; do
            test -s "$page"
            grep -qi "<html" "$page"
            grep -qi "</html>" "$page"
            echo "OK  $page — $(wc -c < "$page") bytes"
          done
          # Refuse to ship a page that pulls in external resources.
          if grep -Eqi '(src|href)="(https?:)?//' dist/index.html dist/deck/index.html dist/dashboard/index.html; then
            echo "::error::An external resource reference was found; pages must be self-contained."
            exit 1
          fi
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
