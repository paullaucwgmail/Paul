<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>待辦清單 · Todo</title>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f2f4f7;
    --text: #16181d;
    --text-muted: #6b7280;
    --border: #e4e7ec;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --danger: #d92d20;
    --danger-soft: #fef3f2;
    --ring: rgba(79, 70, 229, .35);
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px -12px rgba(16, 24, 40, .18);
    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 9px;
    --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
    --space-4: 16px; --space-5: 24px; --space-6: 32px;
    --t: 180ms cubic-bezier(.2, .7, .3, 1);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
            "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #171a21;
      --surface-2: #1e222b;
      --text: #e9ecf1;
      --text-muted: #9aa3b2;
      --border: #2a2f3a;
      --accent: #8b83ff;
      --accent-soft: #23213a;
      --danger: #ff6b5e;
      --danger-soft: #2b1a19;
      --ring: rgba(139, 131, 255, .4);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 40px -18px rgba(0, 0, 0, .7);
    }
  }
  /* manual override (set by the theme button, stored in localStorage) */
  :root[data-theme="light"] {
    --bg:#f6f7f9; --surface:#fff; --surface-2:#f2f4f7; --text:#16181d;
    --text-muted:#6b7280; --border:#e4e7ec; --accent:#4f46e5; --accent-soft:#eef0ff;
    --danger:#d92d20; --danger-soft:#fef3f2; --ring:rgba(79,70,229,.35);
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 12px 32px -12px rgba(16,24,40,.18);
  }
  :root[data-theme="dark"] {
    --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --text:#e9ecf1;
    --text-muted:#9aa3b2; --border:#2a2f3a; --accent:#8b83ff; --accent-soft:#23213a;
    --danger:#ff6b5e; --danger-soft:#2b1a19; --ring:rgba(139,131,255,.4);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 40px -18px rgba(0,0,0,.7);
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: var(--space-6) var(--space-4);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ---------- Card ---------- */
  .app {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  header.app__head {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-5) var(--space-5) var(--space-3);
  }
  .app__title { margin: 0; font-size: 1.25rem; font-weight: 650; letter-spacing: -.01em; }
  .app__sub { margin: 2px 0 0; font-size: .8125rem; color: var(--text-muted); }
  .grow { flex: 1 1 auto; }
  .icon-btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); width: 38px; height: 38px; border-radius: 10px;
    display: grid; place-items: center; cursor: pointer;
    transition: background var(--t), color var(--t), border-color var(--t), transform var(--t);
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn:active { transform: scale(.96); }

  /* ---------- Composer ---------- */
  form.composer {
    display: flex; gap: var(--space-2);
    padding: var(--space-2) var(--space-5) var(--space-4);
  }
  .composer__field { position: relative; flex: 1 1 auto; }
  .composer input[type="text"] {
    width: 100%;
    padding: 13px var(--space-4);
    font: inherit;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    transition: border-color var(--t), background var(--t), box-shadow var(--t);
  }
  .composer input[type="text"]::placeholder { color: var(--text-muted); }
  .composer input[type="text"]:focus {
    outline: none; background: var(--surface);
    border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring);
  }
  .btn-primary {
    appearance: none; border: 1px solid transparent; cursor: pointer;
    font: inherit; font-weight: 600;
    padding: 13px 20px; border-radius: var(--radius-md);
    color: #fff; background: var(--accent);
    transition: filter var(--t), transform var(--t), box-shadow var(--t);
    white-space: nowrap;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(.98); }

  /* ---------- List ---------- */
  ul.tasks { list-style: none; margin: 0; padding: 0 var(--space-3) var(--space-2); }
  li.task {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3);
    border-radius: var(--radius-md);
    transition: background var(--t), opacity var(--t), transform var(--t);
    animation: enter var(--t) both;
  }
  li.task + li.task { border-top: 1px solid var(--border); border-radius: var(--radius-md); }
  li.task:hover { background: var(--surface-2); }
  @keyframes enter { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  li.task.leaving { opacity: 0; transform: translateX(12px); }

  .check { flex: 0 0 auto; position: relative; width: 22px; height: 22px; }
  .check input {
    appearance: none; -webkit-appearance: none;
    width: 22px; height: 22px; margin: 0; cursor: pointer;
    border: 1.5px solid var(--border); border-radius: 7px;
    background: var(--surface);
    transition: background var(--t), border-color var(--t), transform var(--t);
  }
  .check input:hover { border-color: var(--accent); }
  .check input:checked { background: var(--accent); border-color: var(--accent); }
  .check input:checked::after {
    content: ""; position: absolute; inset: 0;
    background: no-repeat center/13px 13px
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
  }
  .check input:active { transform: scale(.92); }

  .task__text {
    flex: 1 1 auto; min-width: 0; cursor: pointer;
    overflow-wrap: anywhere;
    transition: color var(--t);
  }
  li.task.is-done .task__text { color: var(--text-muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }

  .del {
    flex: 0 0 auto; appearance: none; cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--text-muted);
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    opacity: 0; transition: opacity var(--t), background var(--t), color var(--t);
  }
  li.task:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { background: var(--danger-soft); color: var(--danger); }
  @media (hover: none) { .del { opacity: 1; } }   /* touch devices: always visible */

  /* ---------- Empty state ---------- */
  .empty { padding: var(--space-6) var(--space-5); text-align: center; color: var(--text-muted); }
  .empty svg { opacity: .5; margin-bottom: var(--space-3); }
  .empty p { margin: 0; font-size: .9375rem; }

  /* ---------- Footer ---------- */
  footer.app__foot {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-5);
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    font-size: .8125rem; color: var(--text-muted);
  }
  .link-btn {
    appearance: none; border: 0; background: none; cursor: pointer;
    font: inherit; color: var(--accent); padding: 4px 6px; border-radius: 6px;
    transition: background var(--t);
  }
  .link-btn:hover { background: var(--accent-soft); }
  .link-btn[disabled] { color: var(--text-muted); cursor: default; opacity: .55; }

  @media (max-width: 480px) {
    body { padding: var(--space-4) var(--space-2); }
    header.app__head, form.composer, footer.app__foot { padding-left: var(--space-4); padding-right: var(--space-4); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>

<main class="app" aria-labelledby="app-title">
  <header class="app__head">
    <div class="grow">
      <h1 class="app__title" id="app-title">待辦清單</h1>
      <p class="app__sub" id="app-sub">輸入後按 Enter 或「新增」</p>
    </div>
    <button class="icon-btn" id="theme" type="button" aria-label="切換深色／淺色主題" title="切換主題">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
      </svg>
    </button>
  </header>

  <form class="composer" id="form" autocomplete="off">
    <div class="composer__field">
      <label class="sr-only" for="input">新增待辦事項</label>
      <input id="input" name="task" type="text" placeholder="要做什麼？" maxlength="200"
             aria-describedby="app-sub" required>
    </div>
    <button class="btn-primary" type="submit">新增</button>
  </form>

  <ul class="tasks" id="list"></ul>

  <div class="empty" id="empty" hidden>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
    </svg>
    <p>還沒有待辦事項——加一項開始吧。</p>
  </div>

  <footer class="app__foot">
    <span class="grow" id="count">0 項未完成</span>
    <button class="link-btn" id="clear" type="button" disabled>清除已完成</button>
  </footer>
</main>

<p class="sr-only" id="live" role="status" aria-live="polite"></p>

<script>
(function () {
  "use strict";

  var STORE_KEY = "todo.v1";
  var THEME_KEY = "todo.theme";

  var form  = document.getElementById("form");
  var input = document.getElementById("input");
  var list  = document.getElementById("list");
  var empty = document.getElementById("empty");
  var count = document.getElementById("count");
  var clear = document.getElementById("clear");
  var live  = document.getElementById("live");
  var themeBtn = document.getElementById("theme");

  /* ---------- state ---------- */
  var tasks = load();

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var data = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(data)) return [];
      return data.filter(function (t) {
        return t && typeof t.text === "string";
      }).map(function (t) {
        return { id: String(t.id || uid()), text: t.text, done: !!t.done };
      });
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(tasks)); } catch (e) {}
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function announce(msg) { live.textContent = msg; }

  /* ---------- render ---------- */
  function render() {
    list.textContent = "";

    tasks.forEach(function (task) {
      var li = document.createElement("li");
      li.className = "task" + (task.done ? " is-done" : "");
      li.dataset.id = task.id;

      var box = document.createElement("span");
      box.className = "check";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = task.done;
      cb.id = "cb-" + task.id;
      cb.setAttribute("aria-label", "標記為" + (task.done ? "未完成" : "已完成") + "：" + task.text);
      cb.addEventListener("change", function () { toggle(task.id); });
      box.appendChild(cb);

      var label = document.createElement("label");
      label.className = "task__text";
      label.htmlFor = cb.id;
      label.textContent = task.text;          // textContent → no HTML injection

      var del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.setAttribute("aria-label", "刪除：" + task.text);
      del.title = "刪除";
      del.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" ' +
        'stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
        '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
      del.addEventListener("click", function () { remove(task.id, li); });

      li.appendChild(box);
      li.appendChild(label);
      li.appendChild(del);
      list.appendChild(li);
    });

    var left = tasks.filter(function (t) { return !t.done; }).length;
    var done = tasks.length - left;
    count.textContent = left + " 項未完成" + (done ? "（" + done + " 項已完成）" : "");
    empty.hidden = tasks.length !== 0;
    clear.disabled = done === 0;
    save();
  }

  /* ---------- actions ---------- */
  function add(text) {
    tasks.unshift({ id: uid(), text: text, done: false });
    render();
    announce("已新增：" + text);
  }
  function toggle(id) {
    tasks = tasks.map(function (t) {
      if (t.id === id) {
        var next = { id: t.id, text: t.text, done: !t.done };
        announce((next.done ? "已完成：" : "改回未完成：") + next.text);
        return next;
      }
      return t;
    });
    render();
  }
  function remove(id, li) {
    var hit = tasks.filter(function (t) { return t.id === id; })[0];
    if (li) {
      li.classList.add("leaving");
      window.setTimeout(function () { commit(); }, 160);
    } else {
      commit();
    }
    function commit() {
      tasks = tasks.filter(function (t) { return t.id !== id; });
      render();
      if (hit) announce("已刪除：" + hit.text);
      input.focus();
    }
  }
  function clearDone() {
    var n = tasks.filter(function (t) { return t.done; }).length;
    tasks = tasks.filter(function (t) { return !t.done; });
    render();
    announce("已清除 " + n + " 項已完成");
  }

  /* ---------- events ---------- */
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) { input.focus(); return; }
    add(text);
    input.value = "";
    input.focus();
  });

  clear.addEventListener("click", clearDone);

  /* theme: follow the OS unless the user has chosen one */
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (saved === "light" || saved === "dark") {
    document.documentElement.dataset.theme = saved;
  }
  themeBtn.addEventListener("click", function () {
    var isDark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = isDark ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    announce("已切換為" + (next === "dark" ? "深色" : "淺色") + "主題");
  });

  render();
  input.focus();
})();
</script>
</body>
</html>
